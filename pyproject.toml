[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dropline"
version = "0.1.0"
description = "An auditable, self-hosted pipeline for AI characters that correspond with you over real email."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asnly1" }]
keywords = ["llm", "email", "ai-character", "imap", "smtp", "pen-pal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
]
dependencies = [
  "anthropic",
  "dashscope",
  "PyYAML>=6.0",
  "google-genai>=1.0.0",
  "openai>=1.30.0",
  "prompt_toolkit>=3.0.0",
]

[project.scripts]
dropline = "dropline.cli:main"

[project.urls]
Homepage = "https://github.com/Asnly1/dropline"
Repository = "https://github.com/Asnly1/dropline"

[project.optional-dependencies]
test = [
  "pytest",
]
dev = [
  "pytest",
  # Pinned so CI and local runs lint with the same rule implementation; bump deliberately.
  "ruff==0.17.3",
]

[tool.setuptools]
packages = ["dropline"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Rule selection is explicit so lint results do not drift with ruff's default rule set
# (ruff 0.16.0 replaced the historical `E4, E7, E9, F` default with a 400+ rule set).
select = [
  "E4", "E7", "E9", # pycodestyle errors (ruff's historical default)
  "W",              # pycodestyle warnings
  "F",              # pyflakes
  "I",              # isort
  "UP",             # pyupgrade
  "B",              # flake8-bugbear
  "BLE",            # flake8-blind-except: every bare `except Exception` needs an explicit noqa
  "C4",             # flake8-comprehensions
  "SIM",            # flake8-simplify
  "PLE",            # pylint errors
  "RUF",            # ruff-specific rules
  "DTZ003",         # datetime.utcnow() is deprecated since Python 3.12
  "DTZ004",         # datetime.utcfromtimestamp() is deprecated since Python 3.12
]
ignore = [
  "RUF001", "RUF002", "RUF003", # ambiguous-unicode: prompts and tests legitimately use CJK text and fullwidth punctuation
  "SIM117",                     # nested `with` blocks in tests keep `patch(...)` and `assertRaises(...)` visually separate
]
